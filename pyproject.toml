[tool.uv]
workspace = { members = ["benchmarks", "integrations", "client"] }
# langfuse>=3 needs opentelemetry-api>=1.33 while letta (memory-server) pins
# ==1.30.  langfuse is the primary observability integration (used in dev CI);
# memory-server is rarely used.  They can't coexist, so declare the conflict.
conflicts = [
    [{ extra = "langfuse" }, { extra = "memory-server" }],
]

[tool.uv.sources]
lemoncrow-client = { workspace = true }
# courlan imports babel only for Locale.parse(...).language (BCP47 prefix check).
# Override with a minimal functional stub to save ~30 MB from the production install.
# Pre-built wheel so uv generates a named constraint (babel @ file://...) instead of
# an unnamed path, which uv pip install --constraint rejects.
babel = { path = "vendor/babel-99.0.0-py3-none-any.whl" }

[project]
name = "lemoncrow"
version = "0.8.0"
description = "Add local code intelligence to Claude Code, Codex, OpenCode, and Cursor; use Pi through LemonCrow's managed coding runtime; review what changed since you last looked."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "LemonCrow" }]

classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "lemoncrow-client==0.8.0",
    "pydantic>=2.6",
    "click>=8.1",
    "cryptography>=42",
    "pyyaml>=6.0",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "tiktoken>=0.9",
    "blake3>=0.4.1",
    "tree-sitter>=0.23",
    "GitPython>=3.1.50",
    "pygit2==1.19.2",
    "prometheus-client>=0.21",
    "tenacity>=9.0",
    "pybreaker>=1.2",
    # Floor stays at 1.27 on purpose. opentelemetry-sdk only gained API->SDK
    # log-record conversion in Logger.emit at 1.37.0 (_from_api_log_record);
    # on <= 1.36 the OTLP encoder raises AttributeError on the missing
    # `resource`. Raising the floor to 1.37 would make the `memory-server`
    # extra unresolvable -- letta hard-pins opentelemetry-sdk==1.30.0 (see the
    # extras conflict declared at the top of this file). The gap is closed by
    # the feature-detected shim in
    # core/service/telemetry/exporters/otel.py::_sdk_log_record_cls.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # 0.139.0/0.139.1 can transiently 404 valid included-router routes when
    # multiple Reader worker threads hit a freshly built FastAPI app concurrently.
    # 0.139.2 serializes the lazy included-router cache rebuild (FastAPI #15974/#16013).
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.46.0",
    "watchfiles>=1.1.1",
    "urllib3>=2.7.0",
    "beautifulsoup4>=4.12",
    "markdownify>=1.2.2",
    "diff-match-patch>=2.1",
    "tree-sitter-language-pack>=1.8.1",
    "rapidfuzz>=3.14.5",
    "markdown-it-py>=3.0",
    "yarl==1.24.2",
    "zipp==4.1.0",
    "trafilatura>=2.0.0",
    "pdfplumber>=0.11",
    # OSV GHSA-php9-fj8v-98fj and related advisories fixed in 6.19.0.
    "pypdf>=6.19.0",
    "babel>=2.16.0",
    "regex>=2026.5.9",
    "aiohttp>=3.14.1",
    # .gitignore filtering in the code-context engine. Reached dev-only via
    # black/mypy before this was declared, so prod installs silently indexed
    # ignored trees (node_modules, .venv).
    "pathspec>=0.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
memory = ["letta-client>=1.7.12"]
memory-server = ["letta>=0.16.7"]
smart = ["ollama>=0.4.0"]
cloud = ["openai>=1.0"]
postgres = [
    "psycopg[binary]>=3.1",
]
vector = [
    "pgvector>=0.2",
    "numpy>=1.26",
]
# Optional public semantic recall for Runtime Lite. The thin lemoncrow-client
# remains dependency-free; these packages live only in the session helper.
lite-semantic = [
    "model2vec>=0.9,<1",
    "numpy>=2.0",
]
# LemonCrow's private semantic engines and embedder finetuner remain on the
# enterprise runtime distribution. The public lite-semantic extra above is only
# the bounded third-party static-model helper documented by Runtime Lite.
parsers = [
    "tree-sitter-languages>=1.10; python_version < '3.13'",
]
rename = ["rope>=0.23"]
ortools = ["ortools>=9.10"]
litellm = ["litellm>=1.83.14"]
langfuse = ["langfuse>=3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "types-PyYAML",
    "pyinstaller>=6.10.0",
]

[project.scripts]
lemoncrow = "lemoncrow.gateway.cli:main"
lc = "lemoncrow.gateway.cli:main"
lcr = "lemoncrow.gateway.cli:main"

[build-system]
# mypy is the mypyc compiler for release wheels: pinned to the uv.lock version that `make typecheck`
# qualifies, so every release compiles with the same mypyc (tests/test_mypyc_compile_safety.py).
requires = ["hatchling", "setuptools", "mypy==2.2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemoncrow"]

[tool.hatch.build.targets.wheel.force-include]
"src/lemoncrow/core/service/telemetry/frustration_lexicon.yaml" = "lemoncrow/core/service/telemetry/frustration_lexicon.yaml"
"integrations" = "lemoncrow/integrations"

[tool.hatch.build.targets.wheel.hooks.custom]
# hatch_build.py: compiles src/lemoncrow/ with mypyc when LEMONCROW_ENABLE_MYPYC=1 (else pure-Python)

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["benchmarks/mcp_tools/fixtures/downloaded", "benchmarks/codebench/results"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "RUF"]
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]

[tool.black]
line-length = 120
target-version = ["py313"]
force-exclude = 'benchmarks/(codebench/results|mcp_tools/fixtures/downloaded)/'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
pythonpath = ["src", "."]
markers = [
    "slow: marks tests as slow",
    "ab: real A/B benchmark for MCP tool savings",
    "private_engine: needs the private code-intelligence engine (enterprise/runtime); skipped when absent",
    ]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
warn_return_any = false
disallow_subclassing_any = false
explicit_package_bases = true
mypy_path = ["src", "benchmarks", "integrations"]

[[tool.mypy.overrides]]
module = [
    "lemoncrow.core.service.api",
    "lemoncrow.gateway.adapters.http_api",
]
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = [
    "lemoncrow.gateway.cli.app",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
    "scripts.*",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["type-arg", "var-annotated"]

[[tool.mypy.overrides]]
module = [
    "benchmarks.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "lemoncrow.gateway.cli.commands.*",
    "gateway.cli.commands.*",
]
disable_error_code = ["no-untyped-call", "untyped-decorator"]

[tool.pyright]
# Exclude the virtual environment and build artifacts from analysis so that
exclude = [".venv", "**/.venv", "**/node_modules", "**/__pycache__"]

[dependency-groups]
dev = [
    "black>=24.4",
    "httpx>=0.27",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-forked>=1.6.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.5",
    "types-PyYAML",
    "pyinstaller>=6.10.0",
    "vulture>=2.16",
    "litellm>=1.88.1",
    "harbor>=0.13.1",
]
