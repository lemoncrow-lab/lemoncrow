name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  hosted-client-build:
    name: Build hosted thin client
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build architecture-neutral hosted client
        run: bash scripts/build_hosted.sh

      - name: Upload hosted client
        uses: actions/upload-artifact@v4
        with:
          name: hosted-client
          path: |
            dist/lemoncrow-hosted-client.tar.gz
            dist/lemoncrow-hosted-client.tar.gz.sha256
          if-no-files-found: error

  binary-build:
    name: Build release archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build release archive
        run: LEMONCROW_ENABLE_MYPYC=1 bash scripts/build.sh

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/lemoncrow-distribution-*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [hosted-client-build, binary-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: binaries/

      - name: Download hosted thin client
        uses: actions/download-artifact@v4
        with:
          name: hosted-client
          path: hosted/

      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          cat <<EOF > RELEASE_NOTES.md
          ## LemonCrow ${VERSION}

          ### Installation

          \`\`\`bash
          curl -fsSL https://github.com/lemoncrow-lab/lemoncrow/releases/latest/download/hosted.sh | LEMONCROW_HOSTED_URL=https://your-lemoncrow-server bash
          \`\`\`

          ### Assets
          - \`hosted.sh\` — hosted thin-client installer
          - \`lemoncrow-hosted-client.tar.gz\` — architecture-neutral zero-dependency hosted client
          - \`install.sh\` — local/full-distribution installer (\`--hosted\` redirects to \`hosted.sh\`)
          - \`sessions.sh\` — session management utility for full local distributions
          - \`lemoncrow-distribution-*.tar.gz\` — full local-mode bundles for supported platforms
          EOF

      # This workflow runs directly on THIS (public) repo: scripts/mirror.py
      # rewrites it from .github/public-workflows/release.yml (private repo)
      # to .github/workflows/release.yml here. The public server core is mirrored,
      # so platform distributions remain complete local-mode bundles. Hosted mode
      # is the separate architecture-neutral lemoncrow-hosted-client.tar.gz built
      # once above; it contains only the audited thin-client wheel.
      #
      # `make release` (private repo) pushes the release tag to this repo's
      # mirrored SHA before this workflow's trigger can fire, so the tag
      # already points at the right commit -- never delete/recreate it here.
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Delete only a pre-existing Release object on retry -- never the
          # tag, which is the mirrored commit that triggered this run.
          gh release delete "${TAG}" -y || true

          for f in binaries/*.tar.gz; do
            shasum -a 256 "$f" | awk '{print $1}' > "${f}.sha256"
          done

          # build_hosted.sh already produced this sidecar. Verify it again here
          # before publication so a workflow/artifact mix-up fails the release.
          hosted_archive="hosted/lemoncrow-hosted-client.tar.gz"
          hosted_sidecar="${hosted_archive}.sha256"
          test -s "$hosted_archive" -a -s "$hosted_sidecar"
          expected="$(tr -d '[:space:]' < "$hosted_sidecar")"
          actual="$(shasum -a 256 "$hosted_archive" | awk '{print $1}')"
          test "$expected" = "$actual" || { echo "::error::Hosted client checksum mismatch"; exit 1; }

          shopt -s nullglob
          assets=(binaries/* hosted/* scripts/install.sh scripts/hosted.sh scripts/sessions.sh)

          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were found."
            exit 1
          fi

          gh release create "${TAG}" \
            --latest \
            --title "LemonCrow ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"

  cleanup-old-releases:
    name: Cleanup old releases
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Delete old releases (keep latest 3)
        env:
          GH_TOKEN: ${{ github.token }}
          # This job intentionally has no checkout. Give gh explicit repo
          # context so it never tries to discover a .git directory.
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName')

          for tag in $RELEASES; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" -y --cleanup-tag || gh release delete "$tag" -y
          done
