[project]
name = "lemoncrow-client"
version = "0.1.0"
description = "Public LemonCrow thin client: one short-lived MCP stdio process, Python standard library only"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "LemonCrow" }]
readme = "README.md"

# Deliberately empty, and asserted empty by tests/test_packaging_audit.py.
# The auditability of this package is the product: an enterprise security
# review reads one distribution with no transitive dependency tree.
dependencies = []

[project.optional-dependencies]
# Test tooling only. Nothing here is imported by src/lemoncrow_client.
dev = [
  "mypy>=1.20",
  "pytest>=9.0",
]

[project.scripts]
lemoncrow-client = "lemoncrow_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemoncrow_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "enterprise_server: drives the private enterprise server over loopback; skipped when it is not importable",
  "public_registry: compares the bundled tool surface with the public lemoncrow registry",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
