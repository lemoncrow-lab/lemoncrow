name: LemonCrow Review
description: >-
  AI pull request review on your own model key. Posts one summary comment and inline findings as a bot,
  on each push re-reviews only what changed, answers @lemoncrow questions in the pull request's threads, reviews
  the whole pull request on "@lemoncrow review [depth]", and learns from reactions, replies and ignore commands.
author: LemonCrow
branding:
  icon: eye
  color: yellow

# Usage: docs/setup/github-action.md. The model key is a secret passed as an input (`anthropic-api-key` or
# `openai-api-key`). It is handed, through `env:`, to the two steps that need it (the gate and the review) and to no
# other, and the runner is told to mask it. A key set as ANTHROPIC_API_KEY / OPENAI_API_KEY on the calling step still
# works, but GitHub passes a calling step's `env` to every step of this action, so prefer the input.
inputs:
  anthropic-api-key:
    description: >-
      Your Anthropic API key, from a repository secret (the expression is `secrets.ANTHROPIC_API_KEY` in double braces). Used for the review's
      model calls only. Pass this or `openai-api-key`; with both, Anthropic is used unless `model-provider` says
      otherwise. ANTHROPIC_API_KEY set as an environment variable on the step works too.
    default: ""
  openai-api-key:
    description: >-
      Your OpenAI API key, from a repository secret (the expression is `secrets.OPENAI_API_KEY` in double braces). Used for the review's model
      calls only. OPENAI_API_KEY set as an environment variable on the step works too.
    default: ""
  github-token:
    description: >-
      Token the bot comments with. Keep the default, the workflow's GITHUB_TOKEN, so comments come from
      github-actions[bot] and never from a person. Needs contents: read, pull-requests: write and statuses: write
      (issues: read as well for the issues a "Fixes #N" line links). Without them the step fails with the one-line
      `permissions:` block to add.
    default: ${{ github.token }}
  model-provider:
    description: >-
      anthropic, openai or litellm. The default, auto, uses the key you passed as `anthropic-api-key` or
      `openai-api-key` (or ANTHROPIC_API_KEY / OPENAI_API_KEY from the step's environment), Anthropic first when
      both are set.
    default: auto
  model:
    description: >-
      Model id. Default: the provider's own (OpenAI gpt-4o-mini; Anthropic claude-sonnet-4-6).
    default: ""
  depth:
    description: >-
      Review depth, auto, thorough or deep. auto follows review.effort in .lemoncrow/review.yaml and looks at every
      changed code target, in batches of about 12,000 tokens a call, as far as the hard cap of 20 model calls allows,
      the highest-ranked first; thorough and deep also spend what is left of the cap on hypotheses the model proposes.
      It is also the depth of an "@lemoncrow review" comment that names none.
    default: auto
  fail-on:
    description: >-
      "p0" fails the "LemonCrow Review" commit status, and this job, while a P0 finding is open (and when the review
      could not run); "none" keeps it advisory: the job stays green whatever the check says, and a failed review still
      sets the check to error with an annotation naming the cause.
    default: none
  max-usd-per-pr:
    description: >-
      Stop reviewing a pull request once its reviews have cost this many US dollars in total (a number, e.g. 2.50),
      read from the usage the summary comment carries. When it is reached the summary says so, nothing new is
      reviewed and the status is a neutral success. Needs a known cost: the provider's, or a model in the local
      price table. A run cancelled before it saved its summary is not counted. Empty means no limit.
    default: ""
  max-runs-per-pr:
    description: >-
      Stop reviewing a pull request after this many reviews of it (a whole number, e.g. 5). Same behavior as
      max-usd-per-pr when reached, and it works whether or not the cost is known. Empty means no limit.
    default: ""
  review-drafts:
    description: Review draft pull requests too. Drafts are skipped by default.
    default: "false"
  on-push:
    description: Re-review on each push to an open pull request, not only when it opens.
    default: "true"
  security-scan:
    description: >-
      auto or off. auto installs a pinned Opengrep release (checksum verified, cached) and scans only the files the
      pull request changed with a small built-in ruleset (plus the rules `security.rules` names in
      .lemoncrow/review.yaml on your default branch). A result on a changed line becomes evidence the AI review can
      cite, and a P0 it confirms; a result nobody confirmed shows as its own `security` finding, P1 at most. If
      Opengrep cannot be installed or run, the review goes on and the summary says "security scan unavailable". off
      never downloads or runs anything.
    default: auto
  diagram:
    description: >-
      The "Diagram" section of the summary comment, open by default, auto or off. auto draws the relationships the pull request
      added, removed or changed between files as a Mermaid diagram GitHub shows inline, only when there is one worth
      drawing, from the Snapshot's architecture delta: no model call and nothing inferred. off never builds it (it
      parses the repository's source on both sides of the pull request, which a very large repository may not want).
    default: auto
  strictness:
    description: >-
      How much the bot reports, 1, 2 or 3. 1 reports everything: P2 findings are rows in the summary and get an inline
      comment like P0 and P1. 2, the behavior without this input, posts P0 and P1 inline and holds P2 back in a
      collapsed block. 3 never comments on P2: it is counted ("N held back") and listed once, collapsed, below the
      threshold. A P0 is never held back. It is an alias for review.finding_threshold; a value that
      .lemoncrow/review.yaml on the pull request's merge base sets wins over this input. Empty: use the file, else 2.
    default: ""
  inline-comments:
    description: >-
      true or false. false is summary-only mode: no inline comments on the diff, every finding listed in the summary
      comment (the check and fail-on are unchanged). Inline comments carry one-click suggestions and the threads that
      reactions and replies teach the bot from, so a summary-only review has neither. review.inline_comments in
      .lemoncrow/review.yaml on the merge base wins over this input. Empty: use the file, else true.
    default: ""
  max-files:
    description: >-
      A whole number. A pull request with more files than this is reviewed highest-risk files first: the rest are
      named in the summary, which reads "Partially reviewed", and are reviewed on the next push or re-run, never
      skipped. 0 means no limit. review.max_files in .lemoncrow/review.yaml on the merge base wins over this input.
      Empty: use the file, else 100.
    default: ""
  mention-aliases:
    description: >-
      Extra handles the bot answers to in pull request comments, comma separated (for example "@review-bot").
      "@lemoncrow" always works. It is plain text, not a GitHub account; an alias is for a repository where a real
      account already owns "@lemoncrow" (GitHub would notify it). Only used when the workflow also triggers on
      issue_comment and pull_request_review_comment.
    default: ""
  chat-allowed-associations:
    description: >-
      Whose mentions the bot answers, and whose reactions, replies and resolved threads teach it what not to flag on a
      pull request, by the author_association GitHub puts on the comment (for a reaction, the association of a comment
      of theirs, else their repository permission: write counts as COLLABORATOR): a comma separated subset of OWNER,
      MEMBER, COLLABORATOR, CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, MANNEQUIN, NONE. Bots, and this bot, are
      never answered or listened to whatever this says.
    default: "OWNER,MEMBER,COLLABORATOR,CONTRIBUTOR"
  pr-number:
    description: >-
      Pull request to review. Set it for workflow_dispatch runs. The default is the pull request of the event, for a
      pull_request run and for a comment on a pull request.
    default: ${{ github.event.pull_request.number || github.event.issue.number }}
  working-directory:
    description: >-
      Directory of the repository checkout. If it holds no checkout the Action makes one there (your base branch, with the
      pull request's commits and enough history to find its merge base), so a workflow needs no `actions/checkout` step.
    default: "."

runs:
  using: composite
  steps:
    # Standard library only and runs before anything is installed, so a fork, a draft or a missing key costs
    # seconds. Forks get no secrets and a read-only token on pull_request, so they exit 0 with a notice.
    # A comment event (issue_comment, pull_request_review_comment) is the chat mode of this same Action: the gate
    # answers it only when the comment mentions the bot, comes from an allowed author_association and is not from a
    # bot (this one included), and a comment skip never sets a commit status.
    # Any other skip also posts a `skipped: <reason>` success status on the head, with the token below, so a
    # required "LemonCrow Review" check does not wait forever; if the token cannot write statuses it says so.
    # No model key is an error (red job, an annotation naming the two inputs, an `error` status). The keys are masked
    # here, before anything is printed.
    # pull_request_target is refused: it would run with secrets on behalf of code from the pull request.
    - name: Decide whether to review
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        LEMONCROW_REVIEW_PR: ${{ inputs.pr-number }}
        LEMONCROW_REVIEW_DRAFTS: ${{ inputs.review-drafts }}
        LEMONCROW_REVIEW_ON_PUSH: ${{ inputs.on-push }}
        LEMONCROW_REVIEW_PROVIDER: ${{ inputs.model-provider }}
        LEMONCROW_REVIEW_MENTIONS: ${{ inputs.mention-aliases }}
        LEMONCROW_REVIEW_CHAT_ASSOCIATIONS: ${{ inputs.chat-allowed-associations }}
        INPUT_MODEL: ${{ inputs.model }}
      run: |
        if [ -n "$INPUT_MODEL" ]; then export LEMONCROW_REVIEW_MODEL="$INPUT_MODEL"; fi
        python3 "$GITHUB_ACTION_PATH/src/lemoncrow/pro/capabilities/review/pr_bot/ci_env.py"

    # The workspace has to hold the pull request with enough history to find its merge base. With no checkout the Action
    # makes one; a shallow checkout (actions/checkout's default) is deepened; anything it cannot fix stops here with an
    # error that names the fix (`fetch-depth: 0`, or the `contents: read` permission) before anything is installed.
    - name: Check out the pull request
      id: checkout
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        LEMONCROW_REVIEW_PR: ${{ inputs.pr-number }}
        LEMONCROW_WORKDIR: ${{ inputs.working-directory }}
      run: python3 "$GITHUB_ACTION_PATH/src/lemoncrow/pro/capabilities/review/pr_bot/checkout.py"

    # What is worth keeping between runs is small: the pinned security scanner (46 MB) and the tree-sitter parser bundle
    # (18 MB). Python packages are not: restoring their cache costs as much as downloading them. The key names the
    # scanner release and the parser pack version, never a pull request. GitHub scopes a cache to the branch that saved
    # it, so a pull request's first run saves it and its later pushes restore it (docs: "Caching and network").
    - name: Resolve cache
      id: cache_pin
      if: steps.gate.outputs.run == 'true'
      continue-on-error: true
      shell: bash
      env:
        LEMONCROW_SECURITY_SCAN: ${{ inputs.security-scan }}
      run: python3 "$GITHUB_ACTION_PATH/src/lemoncrow/pro/capabilities/review/pr_bot/opengrep_install.py" pin

    # Pinned to the commit the v4 tag points at (v4.3.0), so organizations that require SHA-pinned actions allow it.
    - name: Cache downloads
      if: steps.gate.outputs.run == 'true' && steps.cache_pin.outputs.key != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      continue-on-error: true
      with:
        path: ${{ steps.cache_pin.outputs.dir }}
        key: ${{ steps.cache_pin.outputs.key }}

    # Pinned to the commit the v5 tag points at (v5.4.2), so organizations that require SHA-pinned actions allow it.
    # Its own cache is off on purpose: it would key on the caller's lockfiles, not on this action's.
    - name: Set up uv
      if: steps.gate.outputs.run == 'true'
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      with:
        version: "0.11.32"
        enable-cache: false

    # LemonCrow is not on PyPI. The checkout of this action at the ref the workflow named is the package,
    # installed from its lockfile into a private environment, so the code that reviews is the code you pinned.
    # The runner's own Python is used when it is a supported one: uv would otherwise download its own CPython (107 MB).
    - name: Install LemonCrow
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        EXTRA: ${{ steps.gate.outputs.extra }}
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/lemoncrow-venv
      run: |
        set -euo pipefail
        args=(--project "$GITHUB_ACTION_PATH" --frozen --no-dev --no-progress)
        if [ -n "$EXTRA" ]; then args+=(--extra "$EXTRA"); fi
        python="$(command -v python3 || true)"
        if [ -n "$python" ] && "$python" -c 'import sys; sys.exit(0 if (3, 12) <= sys.version_info[:2] < (3, 14) else 1)'; then
          args+=(--python "$python")
        fi
        uv sync "${args[@]}"

    # Security scan (optional): a pinned Opengrep binary, verified against a SHA-256 before it is ever run, cached between
    # runs. The review step runs it on the changed files only, with a timeout and a result bound. Every step here ends
    # with exit 0: no failure of the scanner fails the review (the summary says "security scan unavailable").
    - name: Install Opengrep
      id: opengrep
      if: steps.gate.outputs.run == 'true' && inputs.security-scan == 'auto'
      continue-on-error: true
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/src/lemoncrow/pro/capabilities/review/pr_bot/opengrep_install.py" install

    - name: Review the pull request
      if: steps.gate.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LEMONCROW_SECURITY_SCAN: ${{ inputs.security-scan }}
        LEMONCROW_OPENGREP_BIN: ${{ steps.opengrep.outputs.bin }}
        LEMONCROW_OPENGREP_NOTE: ${{ steps.opengrep.outputs.note }}
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        LEMONCROW_REVIEW_PR: ${{ inputs.pr-number }}
        LEMONCROW_REVIEW_DRAFTS: ${{ inputs.review-drafts }}
        LEMONCROW_REVIEW_ON_PUSH: ${{ inputs.on-push }}
        LEMONCROW_REVIEW_PROVIDER: ${{ inputs.model-provider }}
        LEMONCROW_REVIEW_MENTIONS: ${{ inputs.mention-aliases }}
        LEMONCROW_REVIEW_CHAT_ASSOCIATIONS: ${{ inputs.chat-allowed-associations }}
        INPUT_MODEL: ${{ inputs.model }}
        DEPTH: ${{ inputs.depth }}
        DIAGRAM: ${{ inputs.diagram }}
        FAIL_ON: ${{ inputs.fail-on }}
        # The noise controls: read by the reviewer from the environment, like the chat settings; the trusted-base
        # .lemoncrow/review.yaml wins over them (docs/setup/github-action.md, "Reducing noise").
        LEMONCROW_REVIEW_STRICTNESS: ${{ inputs.strictness }}
        LEMONCROW_REVIEW_INLINE_COMMENTS: ${{ inputs.inline-comments }}
        LEMONCROW_REVIEW_MAX_FILES: ${{ inputs.max-files }}
        MAX_USD: ${{ inputs.max-usd-per-pr }}
        MAX_RUNS: ${{ inputs.max-runs-per-pr }}
        VENV: ${{ runner.temp }}/lemoncrow-venv
        # No runtime downloads the review does not need: LiteLLM's price table is read from its own package instead of
        # fetched from GitHub's main branch, and the tree-sitter parser bundle lands in the cached directory.
        LITELLM_LOCAL_MODEL_COST_MAP: "True"
        # The Action sends nothing to LemonCrow (docs/setup/github-action.md). DO_NOT_TRACK turns off the engine's anonymous
        # telemetry and its first-run "Telemetry is on" line, which a fresh runner would otherwise print in every job log.
        DO_NOT_TRACK: "1"
        XDG_CACHE_HOME: ${{ runner.temp }}/lemoncrow-cache/xdg
      run: |
        set -euo pipefail
        # An input left empty must not hide LEMONCROW_REVIEW_MODEL set on the step that uses this action.
        if [ -n "$INPUT_MODEL" ]; then export LEMONCROW_REVIEW_MODEL="$INPUT_MODEL"; fi
        # The key inputs become the variables the model clients read, here and in no other step. An empty input leaves
        # a key set as an environment variable on the calling step alone.
        if [ -n "$INPUT_ANTHROPIC_API_KEY" ]; then export ANTHROPIC_API_KEY="$INPUT_ANTHROPIC_API_KEY"; fi
        if [ -n "$INPUT_OPENAI_API_KEY" ]; then export OPENAI_API_KEY="$INPUT_OPENAI_API_KEY"; fi
        unset INPUT_ANTHROPIC_API_KEY INPUT_OPENAI_API_KEY
        # actions/checkout leaves the workflow token in .git/config unless it was told not to (persist-credentials:
        # false), and a checkout made by this action never has it. Give git the token for this step only, in the
        # environment, never on disk.
        server="${GITHUB_SERVER_URL:-https://github.com}"
        if ! git config --get-all "http.${server}/.extraheader" >/dev/null 2>&1; then
          slot="${GIT_CONFIG_COUNT:-0}"
          export "GIT_CONFIG_KEY_${slot}=http.${server}/.extraheader"
          export "GIT_CONFIG_VALUE_${slot}=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT="$((slot + 1))"
        fi
        mkdir -p "$XDG_CACHE_HOME"
        args=(review --pr "$LEMONCROW_REVIEW_PR" --ai --publish-bot --depth "$DEPTH" --fail-on "$FAIL_ON" --diagram "${DIAGRAM:-auto}")
        if [ -n "$MAX_USD" ]; then args+=(--max-usd-per-pr "$MAX_USD"); fi
        if [ -n "$MAX_RUNS" ]; then args+=(--max-runs-per-pr "$MAX_RUNS"); fi
        if [ "$LEMONCROW_REVIEW_DRAFTS" = "true" ]; then args+=(--review-drafts); fi
        if [ "$LEMONCROW_REVIEW_ON_PUSH" = "false" ]; then args+=(--no-on-push); fi
        "$VENV/bin/lemoncrow" "${args[@]}"

    # A composite action has no `post` step, so this is its last step with `if: always()`: it runs after a failure, a
    # timeout or a cancellation too. The review sets the check to `pending` when it starts and replaces it when it ends; a
    # job killed in between would leave a required check waiting for good. If the newest LemonCrow Review status of this
    # run's head is still `pending`, it becomes `error` with a link to this run. It touches nothing else and never
    # fails the job.
    - name: Settle the check
      if: always() && steps.gate.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        LEMONCROW_REVIEW_PR: ${{ inputs.pr-number }}
      run: python3 "$GITHUB_ACTION_PATH/src/lemoncrow/pro/capabilities/review/pr_bot/ci_env.py" settle
