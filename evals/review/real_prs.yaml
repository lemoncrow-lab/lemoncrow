# Real-PR benchmark corpus (G3): public pull requests whose bug a later commit fixed.
#
# Nothing in this file was run against a model. It is the input to
#   uv run lemoncrow dev eval review benchmark --corpus evals/review/real_prs.yaml --depth quick,auto,deep --max-usd 20
# See docs/reference/review-benchmark.md.
#
# Where the labels come from. Each label is one bug and one fix commit. Its `summary` is that fix commit's subject,
# copied. Its `regions` are the source lines the fix edited, taken at the fix's parent and mapped back to the reviewed
# head (`lc dev eval review derive-label` does exactly this from git, and these entries were made with it). `attribution`
# says why the reviewed change is the one that introduced the bug: `fix_message` (the fix's message names it) or `blame`
# (git blame attributes the lines the fix removed to it). `symbols` are identifiers on the lines the fix edited,
# trimmed by hand to the distinctive ones; they let a finding that sits outside the changed lines still catch the label.
# No label here is anyone's opinion of what a good review would say.
#
# What a pull request here is. `base_sha`..`head_sha` is the range a reviewer would have been shown: a squash or
# ordinary commit and its parent, or for a merged branch the merge's second parent and the first parent it forked from.
# `pushes` simulates a follow-up push by applying the fix commit's source edits (`apply_paths`, not its tests or
# changelog) on top of `head_sha`; a push that does not apply is reported and skipped.
#
# How to add a case: find a fix commit whose message names a regression (`git log --grep 'regression'`), then
#   lc dev eval review derive-label --repo <clone> --fix <fix sha> --introduced <introducing sha|merge sha> --id <id> \
#       --repository OWNER/NAME --pull N --title '...' --license <SPDX from the repo's LICENSE> --symbols a,b
# and paste the entry. A pull request you cannot label stays here with `labels: []` and `labelled: false`: it still
# yields cost and finding counts, but no catch or noise rate. Never write a label from a diff you read yourself.
#
# Licences are those of each repository's LICENSE file at the reviewed commit. Only permissively licensed repositories
# are allowed in a public corpus.
#
version: 1
id: real-prs-public
visibility: public
description: Public pull requests (and commits) that shipped a bug a later commit fixed. Ground truth comes only
  from those fix commits; see the header of this file.
line_tolerance: 3
match: either
prs:
