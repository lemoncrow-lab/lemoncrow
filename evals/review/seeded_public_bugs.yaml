# Seeded-bug corpus (public): real pull requests that shipped a bug a later upstream commit fixed. The pull requests
# are those of a public seeded-bug set that a commercial code-review vendor published with its 2025 benchmark
# (5 repositories x 10 pull requests, each a historical change re-opened as a pull request in a fork). Each entry here
# is pinned to the upstream commits (`base_sha`..`head_sha` is the change a reviewer is shown) and labelled by the
# upstream fix, never by a published list of bugs and never by hand. Provenance, the vendor's numbers and the mapping
# from its set to the ids below are in research_notes/LemonCrow strategy memo assessment/benchmark_corpus.md (private).
#
# Nothing in this file was run against a model. It is the input to
#   uv run lemoncrow dev eval review benchmark --corpus evals/review/seeded_public_bugs.yaml --plan                  # no model call, no fetch
#   uv run lemoncrow dev eval review benchmark --corpus evals/review/seeded_public_bugs.yaml --depth quick,auto,deep --max-usd 20
# See docs/reference/review-benchmark.md ("The seeded public bugs").
#
# How the labels were made (same method as real_prs.yaml). A fix commit F edited lines; `lc dev eval review
# derive-label --within-change` takes the lines F removed or changed, maps them back to the reviewed head, keeps the
# ones the reviewed change itself added or changed, and drops tests and docs. `summary` is F's subject, copied.
# `attribution: blame` means `git blame` attributes lines F removed to the reviewed commit. `symbols` are identifiers
# on the lines F edited, trimmed to the distinctive ones (none when every candidate was generic). Where a pull request
# has two labels they are two separate fixes of two separate bugs.
#
# What this corpus is not. The vendor scored one hidden bug per pull request. Those bugs are not published, so a pull
# request here is labelled with the real fix(es) that touch the code it added, and an entry exists only where such a
# fix exists. The vendor's set has pull requests this file cannot carry (no later fix edits their lines, the change is
# not in public history, or the bug was planted); the memo lists each one and why. Labels are bugs somebody fixed, so
# the noise rate is an upper bound: a real bug nobody fixed counts as noise. No `pushes:` are simulated, because the
# fixes landed months later and do not apply on the reviewed head; this corpus measures catch, noise and cost of the
# first review.
#
# Licence. Only permissively licensed repositories are in a public corpus: keycloak/keycloak is Apache-2.0. The
# entries of the other four repositories are in seeded_public_bugs_nonpermissive.yaml.
version: 1
id: seeded-public-bugs
visibility: public
description: Public pull requests from a vendor's published seeded-bug set, permissively licensed repository only; labels
  come from the later upstream fix commits. See the header of this file.
line_tolerance: 3
match: either
