# LemonCrow default security rules for Java.
#
# SPDX-License-Identifier: Apache-2.0
# Original rules written for LemonCrow (see README.md in this directory for provenance and licensing). Tests:
# tests/fixtures/opengrep/java.java (`opengrep scan --test`).
rules:
  - id: lemoncrow.java.runtime-exec-dynamic
    languages: [java]
    severity: ERROR
    message: >-
      Runtime.exec is given a command assembled from other values. A value an attacker controls becomes part of
      the command line. Pass the program and its arguments as separate array elements and validate them.
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($X + ...)
          - pattern: Runtime.getRuntime().exec(String.format(...))
          - pattern: Runtime.getRuntime().exec($CMD)
      - pattern-not: Runtime.getRuntime().exec("...")
      - pattern-not: Runtime.getRuntime().exec(new String[] {...})
    metadata:
      title: "Command injection: Runtime.exec with a dynamic command"
      category: security
      confidence: MEDIUM
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]

  - id: lemoncrow.java.sql-string-building
    languages: [java]
    severity: ERROR
    message: >-
      A SQL statement is built by concatenating or formatting values into the query text. Any value an attacker
      controls changes the query. Use a PreparedStatement with ? placeholders and bind the values.
    patterns:
      - pattern-either:
          - pattern: $S.$M("..." + $X, ...)
          - pattern: $S.$M($X + "...", ...)
          - pattern: $S.$M(String.format(...), ...)
      - pattern-not: $S.$M("..." + "...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(executeQuery|executeUpdate|execute|prepareStatement|createQuery|createNativeQuery|addBatch)$
    metadata:
      title: "SQL injection: query built from strings"
      category: security
      confidence: HIGH
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]

  - id: lemoncrow.java.unsafe-deserialization
    languages: [java]
    severity: ERROR
    message: >-
      ObjectInputStream.readObject() on data that crosses a trust boundary lets an attacker instantiate arbitrary
      classes and run code through gadget chains. Use a data format (JSON) or an ObjectInputFilter allowlist.
    pattern-either:
      - pattern: new ObjectInputStream(...).readObject()
      - pattern: |
          ObjectInputStream $OIS = new ObjectInputStream(...);
          ...
          $OIS.readObject();
    metadata:
      title: "Unsafe deserialization: ObjectInputStream"
      category: security
      confidence: MEDIUM
      cwe: ["CWE-502: Deserialization of Untrusted Data"]

  - id: lemoncrow.java.weak-crypto
    languages: [java]
    severity: ERROR
    message: >-
      A broken algorithm is requested: MD5 or SHA-1 for security purposes, DES, RC4, or AES without an explicit
      authenticated mode (plain "AES" means ECB). Use SHA-256 or better, and AES/GCM/NoPadding.
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("$ALG", ...)
          - pattern: Cipher.getInstance("$ALG", ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^(md5|sha-?1|des|desede|rc4|rc2|blowfish|aes|aes/ecb/.*|des/.*|desede/.*|rc4/.*)$
    metadata:
      title: "Weak digest or cipher"
      category: security
      confidence: HIGH
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
