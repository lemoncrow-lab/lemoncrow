# LemonCrow default security rules for JavaScript and TypeScript.
#
# SPDX-License-Identifier: Apache-2.0
# Original rules written for LemonCrow (see README.md in this directory for provenance and licensing). Tests:
# tests/fixtures/opengrep/javascript.js (`opengrep scan --test`).
rules:
  - id: lemoncrow.javascript.eval-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      eval(), new Function() or a vm.run* call executes a value that is not a string literal. If an attacker can
      influence it they run code in this process. Parse the data (JSON.parse) or dispatch through an explicit map.
    patterns:
      - pattern-either:
          - pattern: eval($CODE)
          - pattern: new Function(..., $CODE)
          - pattern: vm.runInNewContext($CODE, ...)
          - pattern: vm.runInThisContext($CODE, ...)
          - pattern: vm.runInContext($CODE, ...)
      - pattern-not: eval("...")
      - pattern-not: new Function("...")
      - pattern-not: new Function(..., "...")
    metadata:
      title: "Code injection: eval or new Function of a dynamic value"
      category: security
      confidence: HIGH
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"]

  - id: lemoncrow.javascript.child-process-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      child_process.exec or execSync is given a command assembled from other values. The command runs in a shell,
      so a value an attacker controls becomes a shell command. Use execFile or spawn with an argument array.
    patterns:
      - pattern-either:
          - pattern: $CP.$M(`...${$X}...`, ...)
          - pattern: $CP.$M("..." + $X, ...)
          - pattern: $CP.$M($X + "...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(exec|execSync)$
      - metavariable-regex:
          metavariable: $CP
          regex: ^(child_process|childProcess|cp|proc|shell)$
    metadata:
      title: "Command injection: child_process.exec with a dynamic command"
      category: security
      confidence: HIGH
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]

  - id: lemoncrow.javascript.sql-string-building
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A SQL statement is built by concatenating or interpolating values into the query text. Any value an
      attacker controls changes the query. Pass the values as parameters (db.query(sql, [values])).
    patterns:
      - pattern-either:
          - pattern: $DB.$M(`...${$X}...`, ...)
          - pattern: $DB.$M("..." + $X, ...)
          - pattern: $DB.$M($X + "...", ...)
      - pattern-not: $DB.$M("..." + "...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(query|execute|raw|\$queryRawUnsafe|\$executeRawUnsafe)$
    metadata:
      title: "SQL injection: query built from strings"
      category: security
      confidence: HIGH
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]

  - id: lemoncrow.javascript.unsafe-deserialization
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      node-serialize's unserialize() revives functions from the data and runs them, so an attacker who controls
      the input runs code. Use JSON.parse for data that crosses a trust boundary.
    patterns:
      - pattern: $SER.unserialize($DATA, ...)
      - metavariable-regex:
          metavariable: $SER
          regex: ^(serialize|nodeSerialize|node_serialize)$
    metadata:
      title: "Unsafe deserialization: node-serialize"
      category: security
      confidence: HIGH
      cwe: ["CWE-502: Deserialization of Untrusted Data"]

  - id: lemoncrow.javascript.weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      MD5 and SHA-1 are broken for security purposes (passwords, signatures, integrity checks). If this is only a
      cache key or checksum it is fine; otherwise use SHA-256 or a password hash (argon2, bcrypt, scrypt).
    pattern-either:
      - pattern: $C.createHash("md5")
      - pattern: $C.createHash("sha1")
    metadata:
      title: "Weak hash: MD5 or SHA-1"
      category: security
      confidence: MEDIUM
      cwe: ["CWE-328: Use of Weak Hash"]

  - id: lemoncrow.javascript.weak-cipher
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      createCipher/createDecipher derive the key and IV from a password in a fixed way and are removed in recent
      Node versions, and DES, RC4 or ECB mode are broken or leak structure. Use createCipheriv with an
      authenticated mode such as aes-256-gcm and a random IV.
    pattern-either:
      - pattern: $C.createCipher(...)
      - pattern: $C.createDecipher(...)
      - patterns:
          - pattern-either:
              - pattern: $C.createCipheriv("$ALG", ...)
              - pattern: $C.createDecipheriv("$ALG", ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^.*(ecb|\bdes|rc4|rc2|blowfish)
    metadata:
      title: "Broken cipher or ECB mode"
      category: security
      confidence: HIGH
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]

  - id: lemoncrow.javascript.tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      TLS certificate verification is turned off, so the connection can be intercepted and the server cannot be
      authenticated. Remove the override (or trust the right CA) instead of disabling the check.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: "{..., strictSSL: false, ...}"
    metadata:
      title: "TLS certificate verification disabled"
      category: security
      confidence: HIGH
      cwe: ["CWE-295: Improper Certificate Validation"]

  - id: lemoncrow.javascript.ssrf-user-controlled-url
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: >-
      A URL taken from the request reaches an outbound HTTP call. An attacker can make the server call internal
      services or cloud metadata endpoints. Check the host against an allowlist before fetching.
    pattern-sources:
      - patterns:
          - pattern: $REQ.$ATTR
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(query|params|body|headers|cookies)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: axios($URL, ...)
              - pattern: axios.$M($URL, ...)
              - pattern: fetch($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.request($URL, ...)
              - pattern: got($URL, ...)
              - pattern: got.$M($URL, ...)
          - focus-metavariable: $URL
    metadata:
      title: "SSRF: request data reaches an outbound HTTP call"
      category: security
      confidence: MEDIUM
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]

  - id: lemoncrow.javascript.path-traversal-user-input
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: >-
      A path taken from the request reaches a file operation. An attacker can read or delete files outside the
      intended directory with ../ segments. Reduce it to a file name (path.basename) and resolve it inside a fixed
      directory.
    pattern-sources:
      - patterns:
          - pattern: $REQ.$ATTR
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(query|params|body|headers|cookies)$
    pattern-sanitizers:
      - pattern: path.basename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.$M($PATH, ...)
              - pattern: fsp.$M($PATH, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(readFile|readFileSync|createReadStream|writeFile|writeFileSync|unlink|unlinkSync|rm|rmSync|appendFile|appendFileSync)$
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern: $RES.sendFile($PATH, ...)
              - pattern: $RES.download($PATH, ...)
          - focus-metavariable: $PATH
    metadata:
      title: "Path traversal: request data reaches a file operation"
      category: security
      confidence: MEDIUM
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
