# LemonCrow default security rules for hard-coded secrets (any text file).
#
# SPDX-License-Identifier: Apache-2.0
# Original rules written for LemonCrow (see README.md in this directory for provenance and licensing). The
# provider-specific token formats are public format descriptions, not text from any rule set. A rule's message
# never repeats the matched text, so a report never copies the secret. Tests: tests/fixtures/opengrep/secrets.txt
# (`opengrep scan --test`).
rules:
  - id: lemoncrow.secrets.cloud-or-vcs-token
    languages: [regex]
    severity: ERROR
    message: >-
      A credential in a well-known provider format (an AWS access key id, a GitHub, Slack or Stripe token, a Google
      API key) is committed to the repository. Treat it as leaked: revoke it, issue a new one and read it from the
      environment or a secret store.
    patterns:
      - pattern-either:
          - pattern-regex: |-
              \b(?:AKIA|ASIA)[0-9A-Z]{16}\b
          - pattern-regex: |-
              \bgh[pousr]_[A-Za-z0-9]{36,}\b
          - pattern-regex: |-
              \bgithub_pat_[A-Za-z0-9_]{50,}\b
          - pattern-regex: |-
              \bxox[abprs]-[A-Za-z0-9-]{10,}\b
          - pattern-regex: |-
              \b[sr]k_live_[0-9A-Za-z]{20,}\b
          - pattern-regex: |-
              \bAIza[0-9A-Za-z_-]{35}\b
      # AWS's documented example key id. The bracket keeps this source from being a credential-shaped string itself.
      - pattern-not-regex: |-
          AKIAIOSFODNN7EXAMP[L]E
    metadata:
      title: "Hard-coded credential in a provider token format"
      category: security
      confidence: HIGH
      cwe: ["CWE-798: Use of Hard-coded Credentials"]

  - id: lemoncrow.secrets.private-key-block
    languages: [regex]
    severity: ERROR
    message: >-
      A private key is committed to the repository. Treat it as leaked: rotate the key pair, remove it from the
      history and load it at run time from a secret store.
    pattern-regex: |-
      -----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/testdata/**"
        - "**/fixtures/**"
        - "**/examples/**"
        - "**/docs/**"
        - "**/*.md"
    metadata:
      title: "Private key committed to the repository"
      category: security
      confidence: HIGH
      cwe: ["CWE-321: Use of Hard-coded Cryptographic Key"]

  - id: lemoncrow.secrets.credential-assignment
    languages: [regex]
    severity: WARNING
    message: >-
      A password, secret, API key or token is assigned a literal value. If it is real, anyone who can read the
      repository can use it. Read it from the environment or a secret store, and rotate it if it was ever real.
    patterns:
      - pattern-regex: |-
          (?i)\b[\w.-]*(?:passwd|password|secret|api[_-]?key|access[_-]?key|auth[_-]?token|private[_-]?key)["']?\s*[:=]\s*["'][^"'\s$<{}%]{12,}["']
      - pattern-not-regex: |-
          \b(?:AKIA|ASIA)[0-9A-Z]{16}\b|\bgh[pousr]_[A-Za-z0-9]{36,}\b|\bxox[abprs]-[A-Za-z0-9-]{10,}\b|\b[sr]k_live_[0-9A-Za-z]{20,}\b
      - pattern-not-regex: |-
          (?i)["'][^"']*(?:example|changeme|change-me|placeholder|your[_-]|dummy|sample|redacted|xxxx|\*\*\*\*|0000|1234|test)[^"']*["']\s*[,;)]?\s*$
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/testdata/**"
        - "**/fixtures/**"
        - "**/examples/**"
        - "**/docs/**"
        - "**/*.md"
        - "**/*.lock"
        - "**/package-lock.json"
    metadata:
      title: "Hard-coded password, secret or API key"
      category: security
      confidence: MEDIUM
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
