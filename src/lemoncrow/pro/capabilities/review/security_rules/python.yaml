# LemonCrow default security rules for Python.
#
# SPDX-License-Identifier: Apache-2.0
# Original rules written for LemonCrow (see README.md in this directory for provenance and licensing). They are
# not derived from the Semgrep Rules or the opengrep-rules repositories, whose licences do not allow
# redistribution inside a product. Rule ids are namespaced `lemoncrow.`; severity follows the review bot's mapping
# (ERROR -> P1, WARNING -> P2). Tests: tests/fixtures/opengrep/python.py (`opengrep scan --test`).
rules:
  - id: lemoncrow.python.subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      A subprocess call runs through a shell (shell=True) with a command that is not a string literal. If any part
      of the command can come from a request, a file or the environment, an attacker can run their own commands.
      Pass the arguments as a list and drop shell=True.
    patterns:
      - pattern: subprocess.$FUNC($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.$FUNC("...", ..., shell=True, ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(run|call|check_call|check_output|Popen|getoutput|getstatusoutput)$
    metadata:
      title: "Command injection: subprocess call through a shell"
      category: security
      confidence: HIGH
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]

  - id: lemoncrow.python.os-command-dynamic
    languages: [python]
    severity: ERROR
    message: >-
      os.system or os.popen is given a command that is not a string literal. A value an attacker can influence
      becomes a shell command. Use subprocess with a list of arguments and no shell.
    patterns:
      - pattern-either:
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...", ...)
    metadata:
      title: "Command injection: os.system or os.popen with a dynamic command"
      category: security
      confidence: HIGH
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]

  - id: lemoncrow.python.eval-exec-dynamic
    languages: [python]
    severity: ERROR
    message: >-
      eval() or exec() runs a value that is not a string literal. If an attacker can influence it they run code in
      this process. Parse the data (ast.literal_eval, json.loads) or dispatch through an explicit table instead.
    patterns:
      - pattern-either:
          - pattern: eval($CODE, ...)
          - pattern: exec($CODE, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)
    metadata:
      title: "Code injection: eval or exec of a dynamic value"
      category: security
      confidence: HIGH
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"]

  - id: lemoncrow.python.sql-string-building
    languages: [python]
    severity: ERROR
    message: >-
      A SQL statement is built by formatting, concatenating or interpolating values into the query text. Any value
      an attacker controls changes the query. Pass the values as parameters (cursor.execute(sql, params)).
    patterns:
      - pattern-either:
          - pattern: $DB.$M(f"...{$X}...", ...)
          - pattern: $DB.$M("..." + $X, ...)
          - pattern: $DB.$M($X + "...", ...)
          - pattern: $DB.$M("..." % $X, ...)
          - pattern: $DB.$M("...".format(...), ...)
      - pattern-not: $DB.$M("..." + "...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(execute|executemany|executescript|raw)$
    metadata:
      title: "SQL injection: query built from strings"
      category: security
      confidence: HIGH
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]

  - id: lemoncrow.python.pickle-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      pickle, marshal, dill or jsonpickle load data that is not a literal. Loading untrusted bytes with these
      libraries runs arbitrary code. Use a data format (JSON) for anything that crosses a trust boundary.
    patterns:
      - pattern-either:
          - pattern: pickle.$F($DATA, ...)
          - pattern: cPickle.$F($DATA, ...)
          - pattern: _pickle.$F($DATA, ...)
          - pattern: dill.$F($DATA, ...)
          - pattern: marshal.$F($DATA, ...)
          - pattern: jsonpickle.decode($DATA, ...)
          - pattern: shelve.open($DATA, ...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(load|loads|Unpickler|decode|open)$
      - pattern-not: pickle.$F("...", ...)
    metadata:
      title: "Unsafe deserialization: pickle family"
      category: security
      confidence: HIGH
      cwe: ["CWE-502: Deserialization of Untrusted Data"]

  - id: lemoncrow.python.yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load with the full or unsafe loader (or yaml.unsafe_load) can construct arbitrary Python objects from
      the document, which runs code when the document is untrusted. Use yaml.safe_load.
    pattern-either:
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.load($DATA)
      - pattern: yaml.load($DATA, Loader=yaml.Loader)
      - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)
      - pattern: yaml.load($DATA, Loader=yaml.FullLoader)
      - pattern: yaml.load($DATA, yaml.Loader)
      - pattern: yaml.load($DATA, yaml.UnsafeLoader)
    metadata:
      title: "Unsafe deserialization: yaml.load"
      category: security
      confidence: HIGH
      cwe: ["CWE-502: Deserialization of Untrusted Data"]

  - id: lemoncrow.python.weak-hash
    languages: [python]
    severity: WARNING
    message: >-
      MD5 and SHA-1 are broken for security purposes (passwords, signatures, integrity checks). If this is only a
      cache key or checksum, pass usedforsecurity=False; otherwise use SHA-256 or a password hash (argon2, bcrypt).
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
      - pattern-not: hashlib.$H(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.new($N, ..., usedforsecurity=False, ...)
    metadata:
      title: "Weak hash: MD5 or SHA-1"
      category: security
      confidence: MEDIUM
      cwe: ["CWE-328: Use of Weak Hash"]

  - id: lemoncrow.python.weak-cipher
    languages: [python]
    severity: ERROR
    message: >-
      A broken cipher (DES, 3DES, RC4, RC2, Blowfish) or ECB mode is used. ECB leaks the structure of the data and
      the old ciphers can be broken. Use an authenticated mode such as AES-GCM or ChaCha20-Poly1305.
    pattern-either:
      - pattern: $MOD.new($KEY, $MOD.MODE_ECB, ...)
      - pattern: AES.new($KEY, AES.MODE_ECB, ...)
      - pattern: DES.new(...)
      - pattern: DES3.new(...)
      - pattern: ARC4.new(...)
      - pattern: ARC2.new(...)
      - pattern: Blowfish.new(...)
      - pattern: modes.ECB()
    metadata:
      title: "Broken cipher or ECB mode"
      category: security
      confidence: HIGH
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]

  - id: lemoncrow.python.tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificate verification is turned off, so the connection can be intercepted and the server cannot be
      authenticated. Remove verify=False (or trust the right CA bundle) instead of disabling the check.
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: httpx.$M(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: ssl.create_default_context(...).check_hostname = False
    metadata:
      title: "TLS certificate verification disabled"
      category: security
      confidence: HIGH
      cwe: ["CWE-295: Improper Certificate Validation"]

  - id: lemoncrow.python.ssrf-user-controlled-url
    languages: [python]
    severity: ERROR
    mode: taint
    message: >-
      A URL taken from the request reaches an outbound HTTP call. An attacker can make the server call internal
      services or cloud metadata endpoints. Check the host against an allowlist before fetching.
    pattern-sources:
      - patterns:
          - pattern: request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|GET|POST|body|cookies|COOKIES|query_params)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$M($URL, ...)
              - pattern: httpx.$M($URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urlopen($URL, ...)
          - focus-metavariable: $URL
    metadata:
      title: "SSRF: request data reaches an outbound HTTP call"
      category: security
      confidence: MEDIUM
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]

  - id: lemoncrow.python.path-traversal-user-input
    languages: [python]
    severity: ERROR
    mode: taint
    message: >-
      A path taken from the request reaches a file operation. An attacker can read or delete files outside the
      intended directory with ../ segments. Reduce it to a file name (secure_filename, os.path.basename) and
      resolve it inside a fixed directory.
    pattern-sources:
      - patterns:
          - pattern: request.$ATTR
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|GET|POST|body|cookies|COOKIES|query_params|files)$
    pattern-sanitizers:
      - pattern: secure_filename(...)
      - pattern: os.path.basename(...)
      - pattern: pathlib.Path(...).name
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: send_file($PATH, ...)
              - pattern: FileResponse($PATH, ...)
              - pattern: os.remove($PATH)
              - pattern: os.unlink($PATH)
              - pattern: shutil.rmtree($PATH, ...)
          - focus-metavariable: $PATH
    metadata:
      title: "Path traversal: request data reaches a file operation"
      category: security
      confidence: MEDIUM
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
