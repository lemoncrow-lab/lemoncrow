  mode: taint
  languages:
  - typescript
  - javascript
  severity: INFO
  message: Request data reaches an outgoing HTTP request.
  options:
    interfile: true
  metadata:
    category: data-path
    framework: express
    sink_kind: http
  pattern-sources:
  - patterns:
    - pattern: $R.$A
    - metavariable-regex:
        metavariable: $R
        regex: ^(req|request)$
    - metavariable-regex:
        metavariable: $A
        regex: ^(params|query|body|headers|cookies|files|file)$
  - patterns:
    - pattern: $R.$M(...)
    - metavariable-regex:
        metavariable: $R
        regex: ^(req|request)$
    - metavariable-regex:
        metavariable: $M
        regex: ^(get|header|param)$
  - patterns:
    - pattern-either:
      - pattern-inside: $ROUTER.param($NAME, ($REQ, $RES, $NEXT, $V) => { ... })
      - pattern-inside: $ROUTER.param($NAME, async ($REQ, $RES, $NEXT, $V) => { ... })
      - pattern-inside: $ROUTER.param($NAME, function ($REQ, $RES, $NEXT, $V) { ... })
    - pattern: $V
  pattern-propagators:
  - pattern: Object.assign($TO, ..., $FROM, ...)
    from: $FROM
    to: $TO
  pattern-sanitizers:
  - pattern: Boolean(...)
  - pattern: typeof $X
  - pattern: $X.length
  pattern-sinks:
  - patterns:
    - pattern: $F(...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(?:(?:(?s:(.*\.)?(fetch|axios|got)(\.(get|post|put|patch|delete|request|head))?)))$
  - patterns:
    - pattern: $F(...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(?:(?:(?s:(.*\.)?(fetch|axios|got)(\.(get|post|put|patch|delete|request|head))?)))$
    - focus-metavariable: $F
