  - pattern: typeof $X
  - pattern: $X.length
  pattern-sinks:
  - patterns:
    - pattern: $F(...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(?:(?:(?s:(.*\.)?(_?log|_?logger|console)\.(debug|info|warn|error|log|rawInfo|rawWarn|rawError|rawDebug|rawLog|origLog))))$
  - patterns:
    - pattern: $F(...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(?:(?:(?s:(.*\.)?(_?log|_?logger|console)\.(debug|info|warn|error|log|rawInfo|rawWarn|rawError|rawDebug|rawLog|origLog))))$
