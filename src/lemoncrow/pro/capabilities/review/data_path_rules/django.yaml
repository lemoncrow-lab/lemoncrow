          def $H(self, request, ..., $P, ...):
            ...
      - pattern-inside: |
          @api_view(...)
          def $H(request, ..., $P, ...):
            ...
    - pattern: $P
    - metavariable-regex:
        metavariable: $P
        regex: ^(?!self$|request$)\w+$
  - patterns:
    - pattern-inside: |
        def $H(self, $S):
          ...
    - metavariable-regex:
        metavariable: $H
        regex: ^perform_(create|update|destroy)$
    - pattern: $S
  pattern-propagators:
  - pattern: $TO = $M.objects.get(..., $K=$FROM, ...)
    from: $FROM
    to: $TO
  - pattern: $TO = $M.objects.get(..., $FROM, ...)
    from: $FROM
    to: $TO
  - pattern: $TO = get_object_or_404(..., $K=$FROM, ...)
    from: $FROM
    to: $TO
  - pattern: $TO = get_object_or_404(..., $FROM, ...)
    from: $FROM
    to: $TO
  pattern-sanitizers:
  - pattern: len(...)
  - pattern: bool(...)
  - pattern: isinstance(...)
  pattern-sinks:
  - patterns:
    - pattern: $F(...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(?:(?:(requests|httpx)\.(get|post|put|patch|delete|head|request))|(?:(?si:.*(session|client)\.(get|post|put|patch|delete|request)))|(?:(?s:(.*\.)?urlopen)))$
  - patterns:
    - pattern: $F(...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(?:(?:(requests|httpx)\.(get|post|put|patch|delete|head|request))|(?:(?si:.*(session|client)\.(get|post|put|patch|delete|request)))|(?:(?s:(.*\.)?urlopen)))$
    - focus-metavariable: $F
