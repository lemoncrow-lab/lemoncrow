  claude-opus-5-5[1m]: &opus-5-5
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
    cache_write_1h: 8.00
    thinking: 20.00
    context_window: 1000000
  claude-opus-5-5: *opus-5-5

