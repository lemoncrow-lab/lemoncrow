# Built-in pricing overrides for LemonCrow.
# GPT rates updated September 30, 2026.
#
# DESIGN PHILOSOPHY:
# 1. Models known to LiteLLM (like gpt-5.5) are automatically resolved via alias
#    stripping (e.g. "openai/gpt-5.5" -> "gpt-5.5"). Subscription-only vendor
#    prefixes (e.g. "copilot/gpt-5.5") are exempt from this stripping -- see
#    _SUBSCRIPTION_VENDOR_PREFIXES in pricing.py -- so they fall through to the
#    zero-cost default instead of billing the underlying model's real rate.
# 2. This file contains entries for models that are either:
#    a) Missing from LiteLLM (like internal host aliases).
#    b) Subscription-covered but deserve a "market value" proxy to show
#       economic benefit (like Cursor Auto).

overrides:
  # Official OpenAI Standard API rates, verified September 30, 2026.
  # https://developers.openai.com/api/docs/pricing
  # USD per million tokens; long context is >272K input tokens per request.
  # Estimates use Standard rates, not subscription charges or Fast/Batch rates.
  gpt-6.1-sol:
    input: 2
    output: 10
    cache_read: 0.1
    cache_write: 2.5
    thinking: 10
    long_context:
      threshold: 272000
      input: 4
      output: 15
      cache_read: 0.2
      cache_write: 5
  gpt-6-sol:
    input: 2
    output: 10
    cache_read: 0.2
    cache_write: 2.5
    thinking: 10
    long_context:
      threshold: 272000
      input: 4
      output: 15
      cache_read: 0.4
      cache_write: 5
  gpt-6-astra:
    input: 10
    output: 50
    cache_read: 1
    cache_write: 12.5
    thinking: 50
    long_context:
      threshold: 272000
      input: 20
      output: 75
      cache_read: 2
      cache_write: 25
  gpt-6-luna:
    input: 0.1
    output: 0.5
    cache_read: 0.01
    cache_write: 0.125
    thinking: 0.5
    long_context:
      threshold: 272000
      input: 0.2
      output: 0.75
      cache_read: 0.02
      cache_write: 0.25
  gpt-5.6-sol:
    input: 4
    output: 20
    cache_read: 0.4
    cache_write: 5
    thinking: 20
    long_context:
      threshold: 272000
      input: 8
      output: 30
      cache_read: 0.8
      cache_write: 10
  gpt-5.6-terra:
    input: 2
    output: 12
    cache_read: 0.2
    cache_write: 2.5
    thinking: 12
    long_context:
      threshold: 272000
      input: 4
      output: 18
      cache_read: 0.4
      cache_write: 5
  gpt-5.6-luna:
    input: 0.2
    output: 1.2
    cache_read: 0.02
    cache_write: 0.25
    thinking: 1.2
    long_context:
      threshold: 272000
      input: 0.4
      output: 1.8
      cache_read: 0.04
      cache_write: 0.5
  # Cursor Agent Auto Mode
  # Routes between GPT-4o, GPT-5, and Claude 3.5 Sonnet.
  # We use GPT-4o as a conservative "market value" proxy.
  # We use GPT-4o as a conservative "market value" proxy.
  cursor-agent-auto:
    input: 2.50
    output: 10.00
    cache_read: 1.25
    cache_write: 2.50
    thinking: 10.00

